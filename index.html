<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>CoffeeSpec</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
                 color: #8a96ad; font: 13px monospace; pointer-events: none; }
      #bar { width: 200px; height: 6px; background: #243049; border-radius: 3px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #46c46e; }
      #error { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: #ff5f5f; color: #fff; padding: 8px 14px; font: 13px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>Loading...</div><div id="bar"><div id="fill"></div></div></div>
    <div id="error"></div>
    <script>
      // 캔버스를 창 전체에 맞춘다. Unity가 캔버스의 CSS 크기에 맞춰 렌더 크기를 바꾸므로 보이는 화면과 클릭 위치가 항상 같다
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/ec858f0cb19930fa6108bfba261ec539.data.unityweb",
        frameworkUrl: buildUrl + "/4a63ccddf265c919888dd831ef19addc.framework.js.unityweb",
        codeUrl: buildUrl + "/a2889764028915397a9293dc51b61f81.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "PG",
        productName: "CoffeeSpec",
        productVersion: "1.0",
        showBanner: function (msg, type) {
          if (type !== "error") { console.warn(msg); return; }
          var e = document.querySelector("#error"); e.textContent = msg; e.style.display = "block";
        },
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/9ff9fc704e580d70043962fda553b438.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) { config.showBanner(String(message), "error"); });
      };
      document.body.appendChild(script);
      // iframe 안에서도 클릭하면 키보드 입력을 받게 한다
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
